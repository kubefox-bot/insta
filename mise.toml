# Закреплённые версии инструментов: установить через mise install.
[tools]
bun = "1.4.2"
lefthook = "2.1.12"

# Установить зависимости строго по bun.lock, не обновляя версии.
[tasks.install]
run = "bun install --frozen-lockfile"

# Проверить стиль, архитектурные правила и границы модулей.
[tasks.lint]
run = "bun run lint && bun run lint:boundaries"

# Проверить типы общих пакетов и корневых скриптов.
[tasks.typecheck]
run = "bun run typecheck"

# Запустить исходниковые тесты, включая frontend unit/compiler проверки.
[tasks.test]
run = "bun run test"

# Собрать общие инструменты и оба приложения.
[tasks.build]
run = "bun run build"

# Запустить оба приложения на хосте с локальной инфраструктурой.
[tasks.dev]
run = "bun run dev"

# Проверить приложения, контракты, сборки и совместимость.
[tasks."check:apps"]
run = "bun run check:apps"

# Проверить инструменты: lint, границы, типы, тесты и сборку fe-core.
[tasks."check:tooling"]
run = "bun run check:tooling"

# Запустить исходниковые тесты и проверки совместимости.
[tasks."test:unit"]
run = "bun run test:unit"

# Общая проверка перед сдачей; runtime integration/abuse/E2E запускаются отдельно.
[tasks.check]
run = "bun run check"

# Установить Git hooks для проверок перед коммитом.
[tasks."hooks:install"]
run = "bun run hooks:install"

# Подготовить локальные настройки, секреты и HTTPS-сертификаты.
[tasks."infra:prepare"]
run = "bun scripts/infra/run.ts infra:prepare"

# Поднять зависимости для приложений на хосте; Stories включены по умолчанию.
[tasks."infra:up"]
run = "bun scripts/infra/run.ts infra:up"

# Запустить Nest на хосте после подготовки инфраструктуры.
[tasks."dev:backend"]
run = "bun scripts/infra/run.ts dev:backend"

# Запустить Vite с HTTPS и HMR против уже работающего Docker backend.
[tasks."dev:frontend"]
description = "Run the local Vite frontend with HTTPS and HMR against the running Docker backend"
run = "bun scripts/infra/run.ts dev:frontend"

# Собрать Docker-образ backend.
[tasks."build:backend"]
run = "bun scripts/infra/run.ts build:backend"

# Собрать Docker-образ frontend/BFF.
[tasks."build:frontend"]
run = "bun scripts/infra/run.ts build:frontend"

# Запустить Docker backend и необходимые ему сервисы.
[tasks."compose:backend"]
run = "bun scripts/infra/run.ts compose:backend"

# Запустить Docker frontend/BFF и его зависимости; backend запускается отдельно.
[tasks."compose:frontend"]
run = "bun scripts/infra/run.ts compose:frontend"

# Запустить полный Docker-стенд с HTTPS и Stories.
# Для режима только с чатом: STORIES_MODE=disabled mise run compose:up.
[tasks."compose:up"]
run = "bun scripts/infra/run.ts compose:up"

# Остановить выбранный Compose project, сохранив данные и volumes.
[tasks."compose:down"]
run = "bun scripts/infra/run.ts compose:down"
